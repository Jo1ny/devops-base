name: DevOps Base CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Lint Bash scripts with Shellcheck
        run: shellcheck scripts/*.sh

      - name: Validate Bash syntax
        run: bash -n scripts/healthcheck.sh

      - name: Run Trivy vulnerability scanner on base image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nginx:alpine'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Start services via Docker Compose
        run: docker compose up -d

      - name: Verify running containers
        run: docker compose ps

      - name: Verify running containers
        run: docker compose ps

      - name: Wait for service readiness and test
        run: |
          sleep 2
          bash scripts/healthcheck.sh http://127.0.0.1:8085

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs
