name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-scan:
    name: Build Docker & Scan Security
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем репозиторий на раннер
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Собираем Docker-образ
      - name: Build Docker Image
        run: |
          docker build -t my-devops-site:${{ github.sha }} .

      # 3. Security Gate: Сканируем образ через Trivy
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-devops-site:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
